id: ranch-attach-skill-to-template
category: tool_use
difficulty: hard
name: Attach a skill to a template
description: User wants to add a skill to an existing template's skill set without losing existing skills
expectedBehavior: |
  Agent first reads the current template with the `get_template` tool,
  then writes the full union (existing + websearch) with
  `set_template_skills`. The list is exhaustive — sending only
  "websearch" would detach the existing skills. Tools only, no raw HTTP.
messages:
  - text: "Add the websearch skill to template tpl-bridle. Don't drop the others."
    from: eval-user
successCriteria:
  - dimension: tool_usage
    description: Called `get_template` first to see current skillIds, then `set_template_skills` with the full union (not just websearch); no `http` call against the Ranch API
    weight: 0.5
  - dimension: correctness
    description: Final skill list contains existing skills + websearch
    weight: 0.3
  - dimension: response_quality
    description: Confirmed final skill list back to user
    weight: 0.2
