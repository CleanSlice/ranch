<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RANCH: статистика в профиле</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0910;--card:rgba(22,17,28,.72);--card-solid:#16111c;--card2:#1e1726;
  --ln:rgba(255,255,255,.1);--ln2:rgba(255,255,255,.16);--hair:rgba(255,255,255,.07);
  --fg:#f5f1f6;--mut:#a89fae;--dim:#7e7488;
  --cu:#f5a16b;--lv:#c9a1e4;--ok:#4cc38a;--okd:#2fa66b;
  /* categorical, dark band, validated on #16111c (scripts/validate_palette.js) */
  --c1:#de8040;--c2:#a87bd8;--c3:#2a9f96;--c4:#4f86e0;--c0:#6e6478;
  /* outcome status */
  --good:#3fb67b;--warn:#d4a24c;--none:#5b5262;
  /* sequential copper for activity */
  --s0:rgba(255,255,255,.06);--s1:#4a2f22;--s2:#7a4a2e;--s3:#b5683a;--s4:#f5a16b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Geist','Inter',system-ui,sans-serif;font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--cu)}
:focus-visible{outline:2px solid var(--cu);outline-offset:2px}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.dot{font-family:'DotGothic16','Geist Mono',monospace}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── prototype controls (not part of the design) ── */
.proto{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 20px;border-bottom:1px dashed rgba(245,161,107,.35);background:rgba(12,9,16,.94);backdrop-filter:blur(8px);font-size:12.5px}
.proto b{font-weight:600;color:var(--cu);letter-spacing:.04em}
.proto .grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--dim)}
.pg{display:flex;flex-wrap:wrap;gap:2px;padding:2px;border:1px solid var(--ln);border-radius:999px;background:rgba(22,17,28,.7)}
.pg button{min-height:30px;padding:0 11px;border:0;border-radius:999px;background:none;color:var(--mut);white-space:nowrap}
.pg button[aria-pressed=true]{background:var(--cu);color:#1a1220;font-weight:600}
.proto label{display:inline-flex;align-items:center;gap:6px;color:var(--mut);cursor:pointer}
.proto input{accent-color:var(--cu)}

/* ── console chrome ── */
.app{min-height:100vh;background:radial-gradient(60% 46% at 28% 30%,rgba(201,161,228,.08),rgba(201,161,228,0) 70%),radial-gradient(70% 50% at 50% 100%,rgba(245,161,107,.08),rgba(245,161,107,0) 70%),var(--bg)}
.hdr{border-bottom:1px solid var(--ln);background:rgba(12,9,16,.7)}
.hdr .in{max-width:1228px;margin:0 auto;padding:0 24px;min-height:56px;display:flex;flex-wrap:wrap;align-items:center;gap:16px 20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{display:block;width:auto}
.nav{display:flex;gap:2px;padding:3px;border:1px solid var(--ln);border-radius:999px;background:rgba(22,17,28,.6)}
.nav a{padding:8px 16px;border-radius:999px;color:var(--mut);text-decoration:none}
.sp{flex:1 1 0}
.lang{min-height:36px;padding:0 12px;border:1px solid var(--ln);border-radius:999px;background:rgba(22,17,28,.6);color:var(--mut);font-family:'Geist Mono',monospace;font-size:12px;display:inline-flex;align-items:center}
.me{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 6px 0 14px;border:1px solid rgba(245,161,107,.45);border-radius:999px;background:rgba(245,161,107,.08);color:var(--fg);text-decoration:none}
.badge{padding:3px 9px;border:1px solid rgba(245,161,107,.35);border-radius:999px;background:rgba(245,161,107,.12);color:var(--cu);font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.logout{min-height:40px;padding:0 4px;border:0;background:none;color:var(--mut)}

.page{max-width:1180px;margin:0 auto;padding:0 24px 64px;display:grid;grid-template-columns:400px minmax(0,1fr);gap:32px 56px;align-items:start}
@media (max-width:1023px){.page{grid-template-columns:minmax(0,1fr)}.pass-col{max-width:420px;margin:0 auto;width:100%}}

/* ── pass (simplified copy of the shipped component) ── */
.pass-col{display:flex;flex-direction:column;align-items:center}
@media (min-width:1024px){.pass-col{position:sticky;top:56px}}
.strap{width:30px;height:62px;background:repeating-linear-gradient(180deg,#2a2033 0,#2a2033 7px,#332740 7px,#332740 8px);border-inline:1px solid rgba(201,161,228,.35)}
.clip{width:46px;height:20px;margin-bottom:-12px;position:relative;z-index:2;border-radius:6px;background:linear-gradient(180deg,#5a4a66,#2c2236);border:1px solid rgba(255,255,255,.22)}
.pass{position:relative;overflow:hidden;width:100%;border-radius:24px;border:1px solid rgba(255,255,255,.14);background:linear-gradient(158deg,#211829 0%,#140f1b 52%,#1c1322 100%);box-shadow:0 40px 80px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.08)}
.pass .glow{position:absolute;top:-150px;right:-150px;width:340px;height:340px;border-radius:50%;background:conic-gradient(from 210deg,rgba(245,161,107,0),rgba(245,161,107,.34) 50deg,rgba(201,161,228,.36) 110deg,rgba(245,161,107,.16) 170deg,rgba(201,161,228,0) 230deg,rgba(245,161,107,0));filter:blur(26px)}
.pass .slot{position:absolute;top:16px;left:50%;width:62px;height:12px;margin-left:-31px;border-radius:999px;background:var(--bg);box-shadow:inset 0 1px 3px rgba(0,0,0,.9)}
.pass .top{position:relative;padding:48px 28px 22px;display:flex;flex-direction:column;gap:18px}
.pass .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cap{font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.pass h1{margin:0;font-size:28px;line-height:1.1;font-weight:600;text-align:center}
.pass .role{font-family:'DotGothic16','Geist Mono',monospace;font-size:15px;letter-spacing:.16em;color:var(--cu);text-align:center}
.perf{position:relative;height:22px}
.perf i{position:absolute;top:0;width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid rgba(255,255,255,.14)}
.perf i:first-child{left:-12px}.perf i:nth-child(2){right:-12px}
.perf b{position:absolute;left:22px;right:22px;top:10px;border-top:2px dashed rgba(255,255,255,.2)}
.stub{padding:16px 28px 24px;display:flex;flex-direction:column;gap:14px}
.stub .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stub .n{font-family:'DotGothic16','Geist Mono',monospace;font-size:30px;line-height:1}
.stub small{display:block;font-size:12px;color:var(--mut);margin-top:3px}

/* ── right column ── */
.col{min-width:0;display:flex;flex-direction:column;gap:16px}
@media (min-width:1024px){.col{margin-top:40px}}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.seg{display:inline-flex;padding:3px;border:1px solid var(--ln);border-radius:999px;background:var(--card-solid)}
.seg button{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 14px;border:0;border-radius:999px;background:none;color:var(--mut);font-size:13px;font-weight:500;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed=true]{background:#2a2032;color:var(--fg)}
.seg.sm button{min-height:28px;padding:0 11px;font-size:12.5px}
.seg .k{font-family:'Geist Mono',monospace;font-size:10.5px;color:var(--dim)}
.scope{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:-4px}
.scope p{margin:0;font-size:12px;color:var(--dim)}

.card{position:relative;border:1px solid var(--ln);border-radius:18px;background:var(--card);padding:18px 22px 20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.card h2{margin:0;font-size:15px;font-weight:600}
.ch{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-bottom:14px}
.ch .cap{font-size:10px}
.hint{margin:10px 0 0;font-size:12px;color:var(--dim)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:640px){.two{grid-template-columns:minmax(0,1fr)}}

/* data-source notes, shown with the prototype switch */
.src{display:none;margin:-4px 0 14px;padding:9px 11px;border:1px dashed var(--ln2);border-radius:10px;font-size:12px;color:var(--mut)}
.show-src .src{display:block}
.src p{margin:0;display:flex;gap:8px;align-items:baseline}
.src p+p{margin-top:5px}
.src em{flex:none;font-style:normal;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.04em;padding:1px 7px;border-radius:999px;border:1px solid}
.src .ok{color:#7fd6a6;border-color:rgba(76,195,138,.45)}
.src .calc{color:var(--lv);border-color:rgba(201,161,228,.45)}
.src .gap{color:var(--cu);border-color:rgba(245,161,107,.5)}
.legend-src{display:none;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px;color:var(--mut);padding:10px 14px;border:1px dashed var(--ln2);border-radius:14px}
.show-src .legend-src{display:flex}

/* scoreboard */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--ln);border-radius:18px;background:linear-gradient(160deg,rgba(33,24,41,.85),rgba(20,15,27,.85));overflow:hidden}
.board .t{position:relative;padding:16px 18px 15px;min-width:0}
.board .t+.t::before{content:'';position:absolute;left:0;top:16px;bottom:16px;border-left:1px dashed rgba(255,255,255,.16)}
.board .v{font-family:'DotGothic16','Geist Mono',monospace;font-size:clamp(28px,3.2vw,36px);line-height:1;letter-spacing:.01em;white-space:nowrap}
.board .v small{font-family:'Geist',sans-serif;font-size:16px;color:var(--mut)}
.board .l{margin-top:7px;font-size:12.5px;color:var(--mut)}
.board .d{margin-top:6px;font-family:'Geist Mono',monospace;font-size:11px;line-height:1.35;color:var(--dim)}
.board .d.up{color:#7fd6a6}.board .d.down{color:#e8a08a}
@media (max-width:700px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}.board .t:nth-child(3)::before{display:none}.board .t:nth-child(n+3){border-top:1px dashed rgba(255,255,255,.16)}}

/* activity */
.cal-wrap{overflow-x:auto;padding-bottom:2px}
.cal{display:grid;grid-template-rows:14px repeat(7,13px);grid-template-columns:repeat(13,13px);gap:4px;width:max-content}
.cal .m{font-family:'Geist Mono',monospace;font-size:10px;line-height:14px;color:var(--dim);white-space:nowrap;grid-row:1}
.cal .c{width:13px;height:13px;border-radius:3px;background:var(--s0)}
.cal .c.out{opacity:.32}
.cal .c.today{box-shadow:0 0 0 1.5px var(--fg)}
.cal-side{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;margin-top:14px}
.days{display:flex;gap:6px;align-items:flex-end;height:58px}
.days span{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:'Geist Mono',monospace;font-size:10px;color:var(--dim)}
.days i{display:block;width:16px;border-radius:4px 4px 0 0;background:var(--c2)}
.days span.top i{background:var(--cu)}
.scale{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--dim)}
.scale i{width:11px;height:11px;border-radius:3px}
.kv{font-size:13px;color:var(--mut)}
.kv b{color:var(--fg);font-weight:600}

/* agents */
.ag{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:640px){.ag{grid-template-columns:minmax(0,1fr)}.orbit{max-width:260px;margin:0 auto}}
.orbit{width:100%;height:auto;display:block}
.orbit .node{cursor:pointer}
.orbit .node:focus-visible{outline:none}
.orbit .node:focus-visible rect{stroke:var(--cu);stroke-width:2}
.alist{display:flex;flex-direction:column;gap:2px}
.arow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;border:1px solid transparent;border-radius:12px;background:none;text-align:left;width:100%}
.arow:hover{background:rgba(255,255,255,.03)}
.arow.sel{border-color:rgba(245,161,107,.45);background:rgba(245,161,107,.06)}
.av{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;border:1px solid var(--ln2);background:linear-gradient(135deg,#4a3356,#251b2b);font-size:10.5px;font-weight:600}
.arow b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow small{display:block;font-family:'Geist Mono',monospace;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .r{text-align:right;font-size:12px;line-height:1.5;color:var(--mut);white-space:nowrap}
.arow .r b{display:inline;font-size:13px;color:var(--fg)}
.meter{height:4px;border-radius:999px;background:rgba(255,255,255,.07);margin-top:5px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--c2)}
.arow.sel .meter i{background:var(--cu)}

/* topics */
.tp{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px}
@media (max-width:700px){.tp{grid-template-columns:minmax(0,1fr)}}
.tl{display:flex;flex-direction:column;gap:3px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:4px 10px;align-items:center;padding:6px 8px;border:0;border-radius:10px;background:none;text-align:left;width:100%}
.trow:hover{background:rgba(255,255,255,.03)}
.trow span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .n{text-align:right;font-family:'Geist Mono',monospace;font-size:12px;color:var(--mut)}
.pix{grid-column:1/-1;display:flex;gap:2px;height:8px}
.pix i{flex:none;width:6px;height:8px;border-radius:2px;background:var(--c2)}
.pix i.r{background:rgba(201,161,228,.35)}
.trow.sel{background:rgba(245,161,107,.07)}
.trow.sel .pix i{background:var(--cu)}.trow.sel .pix i.r{background:rgba(245,161,107,.38)}
.trow.sel span{color:var(--fg);font-weight:600}
.qs{border-left:1px dashed var(--ln2);padding-left:18px;min-width:0}
@media (max-width:700px){.qs{border-left:0;padding-left:0;border-top:1px dashed var(--ln2);padding-top:14px}}
.qs h3{margin:0 0 3px;font-size:13.5px;font-weight:600}
.qs .meta{font-size:12px;color:var(--dim);margin-bottom:10px}
.q{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--hair)}
.q:first-of-type{border-top:0}
.q .tx{flex:1;min-width:0}
.q b{display:block;font-size:13px;font-weight:500}
.q small{display:block;font-size:11.5px;color:var(--dim);margin-top:2px}
.pill{flex:none;display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border:1px solid var(--ln);border-radius:999px;font-size:11px;color:var(--mut);white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{color:#7fd6a6;border-color:rgba(63,182,123,.45)}
.pill.warn{color:#e6bf73;border-color:rgba(212,162,76,.5)}
.pill.none{color:var(--dim)}

/* segmented (tall) */
.tall{display:flex;gap:2px;height:28px;margin:4px 0 10px}
.tall span{display:flex;align-items:center;padding:0 8px;border-radius:4px;font-size:11.5px;font-weight:600;color:#14101a;white-space:nowrap;overflow:visible;min-width:0}
.tall span.lt{color:#f5f1f6}
.thin{display:flex;gap:2px;height:8px;margin:4px 0 10px}
.thin span{border-radius:999px}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--mut)}
.lg span{display:inline-flex;align-items:center;gap:7px}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg b{color:var(--fg);font-weight:600}
.sent{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.sent div{display:flex;align-items:baseline;gap:8px;padding:8px 10px;border:1px solid var(--hair);border-radius:12px;background:rgba(255,255,255,.02)}
.sent b{display:block;font-family:'DotGothic16','Geist Mono',monospace;font-size:20px;font-weight:400;line-height:1.1}
.sent small{font-size:11.5px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{padding:3px 10px;border:1px solid var(--ln);border-radius:999px;font-family:'Geist Mono',monospace;font-size:11px;color:var(--mut)}

/* open questions */
.oq{display:flex;flex-direction:column}
.oqr{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--hair)}
.oqr:first-child{border-top:0;padding-top:2px}
.oqr .tx{flex:1;min-width:0}
.oqr b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oqr small{display:block;font-size:11.5px;color:var(--dim)}
.go{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 13px;border:1px solid rgba(245,161,107,.45);border-radius:999px;background:rgba(245,161,107,.08);color:var(--cu);font-size:12.5px;font-weight:500;text-decoration:none;white-space:nowrap}
.go:hover{background:rgba(245,161,107,.16)}

/* help tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{padding:14px 14px 13px;border:1px solid var(--hair);border-radius:14px;background:rgba(255,255,255,.02);min-width:0}
.tile .h{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}
.tile .h svg{color:var(--lv);font-size:14px}
.tile .v{margin-top:8px;font-family:'DotGothic16','Geist Mono',monospace;font-size:28px;line-height:1}
.tile .v small{font-family:'Geist',sans-serif;font-size:13px;color:var(--mut)}
.tile .v svg{font-size:15px;color:var(--mut);vertical-align:-1px;margin:0 6px 0 2px}
.tile p{margin:7px 0 0;font-size:12px;color:var(--mut)}
.tile p b{color:var(--fg);font-weight:500}

/* columns chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-family:'Geist Mono',monospace;font-size:10px;fill:var(--dim)}
.tblbtn{border:1px solid var(--ln);border-radius:999px;background:none;color:var(--mut);font-size:11.5px;min-height:26px;padding:0 10px}
.tblbtn[aria-pressed=true]{color:var(--fg);border-color:var(--ln2)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{font-weight:500;color:var(--dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--ln)}
table.t td{padding:6px 8px;border-bottom:1px solid var(--hair);font-variant-numeric:tabular-nums}
table.t td.n,table.t th.n{text-align:right}
.tblwrap{max-height:280px;overflow:auto}

/* owner: ranked rows */
.rk{display:flex;flex-direction:column;gap:9px}
.rkr{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:12px;align-items:center}
.rkr .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkr .nm small{display:block;font-family:'Geist Mono',monospace;font-size:10.5px;color:var(--dim)}
.rkr .b{height:12px;border-radius:0 4px 4px 0;background:var(--c2)}
.rkr .vv{font-family:'Geist Mono',monospace;font-size:12px;color:var(--mut);text-align:right;white-space:nowrap}
.rkr .vv b{color:var(--fg);font-weight:500}
.noprice{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border:1px dashed rgba(245,161,107,.55);border-radius:999px;color:var(--cu);font-size:11px}
.inc{display:flex;flex-direction:column}
.inc div{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--hair);font-size:13px}
.inc div:first-child{border-top:0}
.inc .st{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;white-space:nowrap}
.inc .st.open{color:#ef8a7a}.inc .st.closed{color:var(--dim)}
.inc .st svg{font-size:13px}
.inc .tx{flex:1;min-width:0}
.inc small{display:block;font-family:'Geist Mono',monospace;font-size:10.5px;color:var(--dim)}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 44px 62px 62px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--hair);font-size:13px}
.qrow>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow.h svg{font-size:13px}
.qrow.h{border-top:0;font-size:11px;color:var(--dim);padding-top:0}
.qrow .n{text-align:right;font-family:'Geist Mono',monospace;font-size:12px;color:var(--mut)}
.qrow .n.hot{color:#ef8a7a}

/* empty states */
.empty{padding:30px 24px;text-align:center}
.empty .ic{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 12px;border-radius:14px;background:rgba(245,161,107,.1);color:var(--cu);font-size:20px}
.empty h3{margin:0;font-size:15px}
.empty p{margin:6px auto 0;max-width:420px;font-size:13px;color:var(--mut)}
.empty .go{margin-top:14px}
.soft{padding:16px;border:1px dashed var(--ln2);border-radius:14px;font-size:13px;color:var(--mut)}
.soft b{color:var(--fg);font-weight:500}

/* account tab */
dl.acc{margin:0}
dl.acc div{display:flex;justify-content:space-between;gap:16px;min-height:44px;align-items:center;border-top:1px solid var(--hair)}
dl.acc dt{color:var(--mut)}dl.acc dd{margin:0;font-family:'Geist Mono',monospace;font-size:13px;text-align:right;overflow-wrap:anywhere}

/* tooltip */
.tip{position:fixed;z-index:60;pointer-events:none;max-width:260px;padding:8px 10px;border:1px solid var(--ln2);border-radius:10px;background:#1b1422;box-shadow:0 14px 30px -10px #000;font-size:12px;line-height:1.4;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:600}
.tip .r{display:flex;align-items:center;gap:7px;color:var(--mut)}
.tip .r i{width:9px;height:9px;border-radius:2px}
.tip .r span{flex:1}.tip .r em{font-style:normal;color:var(--fg);font-family:'Geist Mono',monospace;font-size:11px}

/* entrance: cards rise once; reduced motion shows everything at once */
@media (prefers-reduced-motion:no-preference){
  .rise{animation:rise .55s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i,0)*60ms)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}}
  .cal .c.lit{animation:lit .5s ease-out both;animation-delay:calc(var(--k)*5ms)}
  @keyframes lit{from{opacity:0;transform:scale(.4)}}
}
@media (forced-colors:active){.cal .c,.pix i,.tall span,.thin span,.meter i,.rkr .b,.days i{forced-color-adjust:none}}
</style>

  const mx = Math.max(...byWd, 1), top = byWd.indexOf(Math.max(...byWd));
  const days = byWd.map((n, j) => `<span class="${j === top && n ? 'top' : ''}" data-tip="<b>${WDL[(j + 1) % 7]}</b><br>${n} ${plural(n, 'беседа', 'беседы', 'бесед')} за ${P} дн" tabindex="0"><i style="height:${Math.max(3, 40 * n / mx)}px"></i>${WD[(j + 1) % 7]}</span>`).join('');

}

function agentsBlock(cur) {
  const by = AGENTS.map(a => { const l = cur.filter(s => s.agent === a.id); const ins = l.filter(s => s.ins); return { a, conv: l.length, msgs: sum(l, s => s.um), res: ins.length ? pct(ins.filter(s => s.resolved).length, ins.length) : null, last: l.length ? Math.min(...l.map(s => s.d)) : null }; }).filter(x => x.conv).sort((x, y) => y.msgs - x.msgs);

/* ── installation view (Owner, Admin) ── */
function installation() {

  h += `<div class="two">${card('health', 'Здоровье', 'инциденты и лимиты', health(P), i++)}${card('quality', 'Где люди недовольны', 'по беседам установки', quality(ws), i++)}</div>`;

}
function daily(u, P) {

  const W = 640, H = 170, pad = 34, max = Math.max(...days.map(x => x.tot)), step = Math.pow(10, Math.floor(Math.log10(max))) * (max / Math.pow(10, Math.floor(Math.log10(max))) > 5 ? 2 : 1);
  const top = Math.ceil(max / step) * step, bw = (W - pad) / days.length, colW = Math.min(24, Math.max(2, bw - 2));
  let s = `<svg viewBox="0 0 ${W} ${H + 22}" role="img" aria-label="Токены по дням и моделям за ${P} дней. Значения есть в табличном виде.">`;
  for (let v = 0; v <= top; v += step) { const y = H - (H - 8) * v / top; s += `<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)"/><text class="ax" x="${pad - 6}" y="${y + 3}" text-anchor="end">${v >= 1e6 ? (v / 1e6).toLocaleString('ru-RU') + 'M' : v / 1e3 + 'k'}</text>`; }
  days.forEach((x, j) => {
    const cx = pad + j * bw + (bw - colW) / 2; let y = H;
    const segs = MODELS.filter(m => x.m[m.id]);
    segs.forEach((m, k) => { const hh = (H - 8) * x.m[m.id] / top; const last = k === segs.length - 1; y -= hh; s += last ? `<path d="M${cx} ${y + hh}V${y + Math.min(4, hh)}q0 -${Math.min(4, hh)} ${Math.min(4, colW / 2)} -${Math.min(4, hh)}H${cx + colW - Math.min(4, colW / 2)}q${Math.min(4, colW / 2)} 0 ${Math.min(4, colW / 2)} ${Math.min(4, hh)}V${y + hh}Z" fill="${m.c}"/>` : `<rect x="${cx}" y="${y + 1}" width="${colW}" height="${Math.max(0, hh - 2)}" fill="${m.c}"/>`; });
    const tip = `<b>${fmtDay(x.d)}</b>${MODELS.filter(m => x.m[m.id]).map(m => `<div class=r><i style=background:${m.c}></i><span>${m.id.replace('claude-', '')}</span><em>${nf(x.m[m.id] / 1e3)}k</em></div>`).join('')}<div class=r><span>≈ стоимость</span><em>$${x.$.toFixed(2)}</em></div>`;
    s += `<rect x="${pad + j * bw}" y="0" width="${bw}" height="${H}" fill="transparent" data-tip="${tip.replace(/"/g, '&quot;')}" tabindex="${P <= 30 ? 0 : -1}"/>`;
    if (j === 0 || j === days.length - 1 || (P > 7 && j % Math.ceil(days.length / 5) === 0 && j < days.length - 3)) s += `<text class="ax" x="${cx + colW / 2}" y="${H + 15}" text-anchor="middle">${dayDate(x.d).getDate()} ${MON[dayDate(x.d).getMonth()]}</text>`;
  });
  s += '</svg>';

  return `<div class="chart">${s}</div><div class="lg" style="margin-top:8px">${used.map(m => `<span><i style="background:${m.c}"></i>${m.id}${m.p ? '' : ' <span class="noprice">нет цены</span>'}</span>`).join('')}</div>`;
}
function wagents(u) {
  const by = AGENTS.map(a => { const l = u.filter(r => r.agent === a.id); const c = M(a.model).p ? sum(l, cost) : null; return { a, c, tok: sum(l, r => r.inT + r.outT), calls: sum(l, r => r.calls) }; }).filter(x => x.tok).sort((x, y) => (y.c ?? -1) - (x.c ?? -1));
  const mx = Math.max(...by.map(x => x.c || 0)), T = sum(by, x => x.c || 0), days = st.period;
  return `<div class="rk">${by.map(x => `<div class="rkr"><span class="nm">${x.a.name}<small>${x.a.model}</small></span><span>${x.c === null ? '<span class="noprice">нет цены · считается как $0</span>' : `<span class="b" style="display:block;width:${Math.max(2, 100 * x.c / mx)}%" data-tip="<b>${x.a.name}</b><br>${nf(x.tok / 1e3)}k токенов · ${nf(x.calls)} вызовов" tabindex="0"></span>`}</span><span class="vv">${x.c === null ? `${nf(x.tok / 1e3)}k ток.` : `<b>$${x.c.toFixed(0)}</b> · ${pct(x.c, T)}%`}</span></div>`).join('')}</div>
    <p class="hint">При таком темпе за 30 дней ≈ <b style="color:var(--fg)">$${nf(T / days * 30)}</b>. Цена из таблицы model-pricing.ts, не из счёта провайдера.</p>`;
}
function health(P) {
  const inc = INCIDENTS.filter(x => x.d < P), ref = REFUSED.filter(r => r.d < P);
  const refBy = {}; ref.forEach(r => refBy[r.agent] = (refBy[r.agent] || 0) + r.n);
  return `<div class="inc">${inc.length ? inc.map(x => `<div><span class="st ${x.open ? 'open' : 'closed'}">${ic(x.open ? 'alert' : 'check')}${x.open ? 'открыт' : 'закрыт'}</span><span class="tx">${A(x.agent).name}<small>${x.reason} · ${ago(x.d)}${x.dur ? ' · ' + x.dur : ''}</small></span></div>`).join('') : `<div><span class="st closed">${ic('check')}</span><span class="tx">Инцидентов за ${P} дн не было</span></div>`}</div>
    <div class="cap" style="margin:14px 0 8px">Отказы по лимиту запросов</div>
    ${Object.keys(refBy).length ? Object.entries(refBy).map(([id, n]) => `<div class="kv" style="display:flex;justify-content:space-between;padding:3px 0">${A(id).name}<b class="mono">${nf(n)}</b></div>`).join('') + `<p class="hint">Отказы видят посетители публичных агентов. Лимит меняется в настройках агента.</p>` : '<div class="kv">Отказов не было</div>'}`;
}
function quality(ws) {
  const rows = AGENTS.map(a => { const l = ws.filter(s => s.agent === a.id), ins = l.filter(s => s.ins), up = sum(l, s => s.up), dn = sum(l, s => s.down); return { a, n: l.length, open: ins.length ? pct(ins.filter(s => !s.resolved).length, ins.length) : null, down: up + dn ? pct(dn, up + dn) : null }; }).filter(x => x.n).sort((x, y) => (y.open ?? 0) - (x.open ?? 0));
  const worstOpen = Math.max(...rows.map(r => r.open ?? 0)), worstDown = Math.max(...rows.map(r => r.down ?? 0));
  return `<div class="qrow h"><span>Агент</span><span class="n">бесед</span><span class="n">открыто</span><span class="n" title="Доля плохих оценок">${ic('down')}</span></div>${rows.map(r => `<div class="qrow"><span>${r.a.name}</span><span class="n">${r.n}</span><span class="n${r.open === worstOpen ? ' hot' : ''}">${r.open ?? '—'}${r.open !== null ? '%' : ''}</span><span class="n${r.down === worstDown && r.down ? ' hot' : ''}">${r.down ?? '—'}${r.down !== null ? '%' : ''}</span></div>`).join('')}`;
}

/* ── account tab (the cards that are on the page today) ── */
function account() {
  return `<article class="card rise"><div class="ch"><h2>Учётная запись</h2></div><dl class="acc"><div><dt>Имя</dt><dd>Alex Morgan</dd></div><div><dt>Email</dt><dd>alex.morgan@example.com</dd></div><div><dt>ID</dt><dd>4c2e81b7-…-9f10</dd></div><div><dt>Роль</dt><dd>${ROLE[st.role][0]}</dd></div><div><dt>Версия консоли</dt><dd>0.3.x</dd></div></dl></article>
  <article class="card rise" style="--i:1"><div class="ch"><h2>Что вам доступно</h2></div><p class="hint" style="margin:0">Без изменений: карточка «Что вам доступно» и строка «Этот браузер: вход выполнен» остаются как на странице сейчас.</p></article>`;
}

/* ── render ── */
function render() {
  const col = document.getElementById('col');
  let h = `<div class="bar"><div class="seg" role="tablist" aria-label="Раздел профиля"><button role="tab" data-tab="stats" aria-pressed="${st.tab === 'stats'}" aria-selected="${st.tab === 'stats'}">${ic('chart')}Статистика</button><button role="tab" data-tab="account" aria-pressed="${st.tab === 'account'}" aria-selected="${st.tab === 'account'}">${ic('user')}Учётная запись</button></div><span class="sp"></span>`;
  if (st.tab === 'stats') h += `<div class="seg sm" role="group" aria-label="Период">${[7, 30, 90].map(p => `<button data-period="${p}" aria-pressed="${st.period === p}">${p} дн</button>`).join('')}</div>`;
  h += `</div>`;
  if (st.tab === 'stats') {
    if (operator()) h += `<div class="scope"><div class="seg sm" role="group" aria-label="Чья статистика"><button data-scope="mine" aria-pressed="${st.scope === 'mine'}">Мои беседы</button><button data-scope="ws" aria-pressed="${st.scope === 'ws'}">Вся установка</button></div><p>${st.scope === 'ws' ? 'Видят владелец и администраторы.' : st.role === 'Owner' ? 'Ваши беседы из консоли и админ-панели: у владельца это общий канал admin.' : 'Видите только вы.'}</p></div>`;
    else h += `<div class="scope"><p>Статистику по вашим беседам видите только вы.</p></div>`;
    h += `<div class="legend-src"><b style="color:var(--fg);font-weight:600">Откуда берутся цифры:</b><span class="src" style="display:contents"><em class="ok" style="font-style:normal;font-family:Geist Mono;font-size:10px;padding:1px 7px;border:1px solid;border-radius:999px">есть в API</em><em class="calc" style="font-style:normal;font-family:Geist Mono;font-size:10px;padding:1px 7px;border:1px solid;border-radius:999px">в БД, нужен агрегат</em><em class="gap" style="font-style:normal;font-family:Geist Mono;font-size:10px;padding:1px 7px;border:1px solid;border-radius:999px">не записывается</em></span></div>`;
    h += operator() && st.scope === 'ws' ? installation() : personal();
  } else h += account();
  col.innerHTML = h;
  document.getElementById('app').classList.toggle('show-src', st.src);
  document.getElementById('h-role').textContent = ROLE[st.role][0];
  document.getElementById('p-rl').textContent = ROLE[st.role][1];
  document.getElementById('slots').style.display = operator() ? '' : 'none';
  document.querySelectorAll('[data-role]').forEach(b => b.setAttribute('aria-pressed', b.dataset.role === st.role));
  document.querySelectorAll('[data-d]').forEach(b => b.setAttribute('aria-pressed', b.dataset.d === st.data));
  countUp();
}
// Numbers count up once when they change; reduced motion shows them as they are.
function countUp() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count, tail = el.innerHTML.replace(/^[^<]*/, ''), t0 = performance.now(), dur = 700;
    const f = now => { const k = Math.min(1, (now - t0) / dur), v = Math.round(to * (1 - Math.pow(1 - k, 3))); el.innerHTML = nf(v) + tail; if (k < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  });
}

/* ── events ── */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-role],[data-d],[data-tab],[data-period],[data-scope],[data-topic],[data-agent],[data-tbl],a[href="#"]');
  if (!t) return;
  if (t.matches('a[href="#"]')) { e.preventDefault(); return; }
  if (t.dataset.role) { st.role = t.dataset.role; if (!operator()) st.scope = 'mine'; }
  if (t.dataset.d) st.data = t.dataset.d;
  if (t.dataset.tab) st.tab = t.dataset.tab;
  if (t.dataset.period) st.period = +t.dataset.period;
  if (t.dataset.scope) st.scope = t.dataset.scope;
  if (t.dataset.topic) st.topic = t.dataset.topic;
  if (t.dataset.agent) st.agent = t.dataset.agent;
  if (t.dataset.tbl) st.tables[t.dataset.tbl] = !st.tables[t.dataset.tbl];
  hideTip(); render();
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g.node')) { e.preventDefault(); st.agent = e.target.dataset.agent; render(); } if (e.key === 'Escape') hideTip(); });
document.getElementById('p-src').addEventListener('change', e => { st.src = e.target.checked; render(); });
const tip = document.getElementById('tip');
function showTip(el) { tip.innerHTML = el.getAttribute('data-tip'); tip.classList.add('on'); const r = el.getBoundingClientRect(), w = tip.offsetWidth, hh = tip.offsetHeight; let x = r.left + r.width / 2 - w / 2, y = r.top - hh - 8; if (y < 54) y = r.bottom + 8; x = Math.max(8, Math.min(innerWidth - w - 8, x)); tip.style.left = x + 'px'; tip.style.top = y + 'px'; }
function hideTip() { tip.classList.remove('on'); }
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); el ? showTip(el) : hideTip(); });
document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); el ? showTip(el) : hideTip(); });
document.addEventListener('scroll', hideTip, { passive: true });
render();
</script>
</body>
