id: ranch-read-agent-file
category: tool_use
difficulty: easy
name: Read an agent's SOUL.md
description: User wants to see the personality config of an agent
expectedBehavior: |
  Agent calls the `read_agent_file` tool with agentId="agent-bridle-42"
  and path="SOUL.md", then returns the contents. Tools only, no raw HTTP.
messages:
  - text: "Show me SOUL.md of agent-bridle-42"
    from: eval-user
successCriteria:
  - dimension: tool_usage
    description: |
      Called `read_agent_file` with agentId+path. No `http` or `exec` call
      against the Ranch API.
    weight: 0.5
  - dimension: correctness
    description: Returned the response from the call, not paraphrased
    weight: 0.3
  - dimension: response_quality
    description: No commentary — just the file (or the error)
    weight: 0.2
