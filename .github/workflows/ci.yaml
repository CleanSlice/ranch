name: CI

on:
  # Every pull request, not just the ones targeting main: stacked PRs (a chain
  # of branches merged bottom-up at the end) target their parent branch, and
  # with a `branches: [main]` filter they would ride all the way to the final
  # merge without a single CI run.
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: api
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: bunx prisma-import --force && bunx prisma generate

      - name: Generate API swagger
        working-directory: api
        run: bun run build && bun run generate:swagger

      - name: Typecheck consoles
        run: bunx turbo typecheck --filter=app --filter=admin

      # Compares key sets and source hashes only — no network, no API key, so
      # it runs on forks too. Fix a failure with `bun run i18n:sync`.
      - name: Check i18n locale parity
        run: bun run i18n:check

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
