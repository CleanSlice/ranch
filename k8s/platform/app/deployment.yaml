apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranch-app
  namespace: platform
  labels:
    app: ranch-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ranch-app
  template:
    metadata:
      labels:
        app: ranch-app
    spec:
      nodeSelector:
        node-role: system
      containers:
        - name: app
          image: ghcr.io/cleanslice/ranch-app:latest
          ports:
            - containerPort: 3000
          env:
            - name: NUXT_PUBLIC_API_URL
              value: https://api.ranch.cleanslice.org
            # Error tracking (CLEAN-218). The destination lives in the cluster,
            # never in this file: without the secret or the key, reporting is
            # off. See docs/operations/error-tracking.md.
            - name: NUXT_PUBLIC_SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: ranch-error-tracking
                  key: APP_SENTRY_DSN
                  optional: true
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
