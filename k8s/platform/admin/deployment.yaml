apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranch-admin
  namespace: platform
  labels:
    app: ranch-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ranch-admin
  template:
    metadata:
      labels:
        app: ranch-admin
    spec:
      nodeSelector:
        node-role: system
      containers:
        - name: admin
          image: ghcr.io/cleanslice/ranch-admin:latest
          ports:
            - containerPort: 3001
          env:
            # Error tracking (CLEAN-218). The destination lives in the cluster,
            # never in this file: without the secret or the key, reporting is
            # off. See docs/operations/error-tracking.md.
            - name: NUXT_PUBLIC_SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: ranch-error-tracking
                  key: ADMIN_SENTRY_DSN
                  optional: true
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
