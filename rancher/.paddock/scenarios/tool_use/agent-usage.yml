id: ranch-agent-usage
category: tool_use
difficulty: medium
name: Token usage report for an agent
description: User asks for recent token spend by a specific agent
expectedBehavior: |
  Agent calls the `agent_usage` tool with agentId="agent-bridle-42" and an
  explicit 7-day window (`days: 7`). It does not reach for raw HTTP: Ranch
  is worked through its tools only.
messages:
  - text: "How many tokens did agent-bridle-42 spend in the last 7 days?"
    from: eval-user
successCriteria:
  - dimension: tool_usage
    description: |
      Called `agent_usage` with agentId="agent-bridle-42" and days=7. No
      `http` or `exec` call against the Ranch API.
    weight: 0.5
  - dimension: correctness
    description: Reported a numeric total derived from the response (or surfaced the error)
    weight: 0.3
  - dimension: response_quality
    description: Numeric, compact answer
    weight: 0.2
