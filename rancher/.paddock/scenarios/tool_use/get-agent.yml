id: ranch-get-agent
category: tool_use
difficulty: easy
name: Inspect a single agent
description: User asks for details on a specific agent by id
expectedBehavior: |
  Agent calls the `get_agent` tool with id="agent-abc123", then reports
  status / workflowId / template (or surfaces "not found" cleanly). Tools
  only, no raw HTTP.
messages:
  - text: "What's the status of agent agent-abc123?"
    from: eval-user
successCriteria:
  - dimension: tool_usage
    description: |
      Called `get_agent` with id="agent-abc123". No `http` or `exec` call
      against the Ranch API.
    weight: 0.5
  - dimension: correctness
    description: Reported what the call returned, did not fabricate fields
    weight: 0.3
  - dimension: response_quality
    description: Direct answer, no narration before the tool call
    weight: 0.2
