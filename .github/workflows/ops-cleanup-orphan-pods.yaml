# One-off cleanup of orphaned agent pods identified on 2026-07-29: pods
# labeled app=ranch-agent whose agents were deleted from the DB, but whose
# pod deletion silently failed because the prod Role lacked the delete verb
# (fixed in k8s/platform/api/rbac.yaml). Explicit allowlist — never deletes
# by label, so a live agent can't be hit. --ignore-not-found makes reruns
# harmless no-ops.

name: Ops - cleanup orphan agent pods (2026-07-29)

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Delete orphan pods (8 Running leaked + 8 Pending stuck)
        run: |
          kubectl -n agents delete pod --ignore-not-found \
            agent-agent-dab9dfdc-05c8-4b61-9b52-ec62f04fb1d9 \
            agent-agent-0955b893-c94a-40cb-82ce-c60302576a47 \
            agent-agent-8f77cc85-34fe-462a-b6b4-f7cd7b505468 \
            agent-agent-ed238997-8687-4d12-bc40-23c483b3c872 \
            agent-agent-57e94f15-6113-4b60-be39-0f347e74a5d2 \
            agent-agent-8098c69a-2186-48b6-b02e-46a9c0d45546 \
            agent-agent-6328a8a3-0c1d-4ece-9b19-69fa5d55f32e \
            agent-agent-34848b49-9007-44ca-8dbb-2641969cf04a \
            agent-agent-4fab2d57-7e0d-4c82-98c8-ede1264ea70c \
            agent-agent-50614bd5-fb07-4f11-8f43-17505d0a6bc8 \
            agent-agent-28180868-6874-478b-ad0d-8df182ae9809 \
            agent-agent-0f108591-8909-4009-a914-dea8da1af1ba \
            agent-agent-640fe402-d233-404f-b841-85b8db4030c8 \
            agent-agent-08cfbfc7-def1-474f-a111-dbbfa0c82d45 \
            agent-agent-abb35f12-9721-4f65-a04b-03928a70e6f8 \
            agent-agent-9a0b26ba-bc3a-4885-96b7-2c2ba2cfac82

      - name: Remaining live agent pods
        run: |
          kubectl get pods -A -l app=ranch-agent -o wide --sort-by=.metadata.creationTimestamp
          echo "total: $(kubectl get pods -A -l app=ranch-agent --no-headers | grep -cv 'Succeeded\|Failed' || true)"
