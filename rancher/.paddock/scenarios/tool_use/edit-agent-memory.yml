id: ranch-edit-agent-memory
category: tool_use
difficulty: hard
name: Append a fact to agent memory and restart
description: User asks to add a new fact to another agent's MEMORY.md and restart
expectedBehavior: |
  Agent (1) reads MEMORY.md with `read_agent_file`, (2) writes the merged
  content with `write_agent_file`, (3) restarts with `restart_agent`.
  Confirms each step briefly. Tools only, no raw HTTP.
messages:
  - text: "Add this to agent-bridle-42 memory: 'user prefers metric units'. Then restart it."
    from: eval-user
successCriteria:
  - dimension: tool_usage
    description: `read_agent_file` → `write_agent_file` (preserved existing content + appended fact) → `restart_agent`; no `http` call against the Ranch API
    weight: 0.5
  - dimension: correctness
    description: Wrote file contains both old content and the new fact
    weight: 0.3
  - dimension: response_quality
    description: Brief confirmation, no extra ceremony
    weight: 0.2
